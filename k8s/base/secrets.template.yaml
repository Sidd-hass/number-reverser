# STUBBED SECRET TEMPLATE
# In accordance with regulated environment standards, sensitive credentials are NEVER committed to version control.
# In a full production deployment, secrets are synchronized via External Secrets Operator (ESO) backed by
# AWS Secrets Manager or HashiCorp Vault.
#
# For local evaluation or bootstrapping, apply this template using environment substitution:
# envsubst < secrets.template.yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: number-reverser-secrets
  namespace: number-reverser
  labels:
    app.kubernetes.io/name: number-reverser
type: Opaque
stringData:
  API_KEY: "${API_SECRET_KEY:-stubbed-secure-token-change-in-prod}"

