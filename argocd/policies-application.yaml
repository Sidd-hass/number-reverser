apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: number-reverser-policies
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: number-reverser-policies
spec:
  project: default
  source:
    repoURL: https://github.com/Sidd-hass/number-reverser.git
    targetRevision: master
    path: k8s/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true

